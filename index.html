<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Efectos de Sonido</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-active: #334155;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --active-glow: rgba(56, 189, 248, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-sub);
        }

        .controls-bar {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .stop-all-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stop-all-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
        }

        .sound-card {
            background-color: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        .sound-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-active);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .sound-card.playing {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--active-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--active-glow); }
            50% { box-shadow: 0 0 22px var(--active-glow); }
            100% { box-shadow: 0 0 10px var(--active-glow); }
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 2.2rem;
            transition: transform 0.2s ease;
        }

        .sound-card:hover .icon-wrapper {
            transform: scale(1.1);
        }

        .sound-title {
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .loop-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        .loop-control input[type="checkbox"] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .sound-card.playing .status-badge {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
    </style>
</head>
<body>

    <header>
        <h1>Efectos de Sonido - Obra</h1>
        <p>Haz clic en cualquier tarjeta para reproducir o detener el audio</p>
    </header>

    <div class="controls-bar">
        <button class="stop-all-btn" onclick="stopAllAudio()">
            ⏹ Detener Todos los Sonidos
        </button>
    </div>

    <div class="grid-container" id="soundGrid"></div>

    <script>
        // Ruta base local para tus archivos de audio
        const basePath = 'C:/Users/Gmag/Music/AudiosObra/';

        // Lista de archivos con la ruta completa asignada
        const soundList = [
            { name: 'Aleteo', file: basePath + 'Aleteo.mp3', icon: '🕊️' },
            { name: 'Cierre Puerta', file: basePath + 'CierrePuerta.mp3', icon: '🚪' },
            { name: 'Cuervo', file: basePath + 'Cuervo.mp3', icon: '🐦‍⬛' },
            { name: 'Elefante', file: basePath + 'Elefante.mp3', icon: '🐘' },
            { name: 'Gente Murmullo', file: basePath + 'Gente-murmullo.mp3', icon: '👥' },
            { name: 'León', file: basePath + 'Leoin.mp3', icon: '🦁' },
            { name: 'Lluvia', file: basePath + 'Lluvia.mp3', icon: '🌧️' },
            { name: 'Martillo Madera', file: basePath + 'Marill-Madera.mp3', icon: '🔨' },
            { name: 'Mono', file: basePath + 'Mono.mp3', icon: '🐒' },
            { name: 'Océano', file: basePath + 'Oceano.mp3', icon: '🌊' },
            { name: 'Oveja', file: basePath + 'Oveja.mp3', icon: '🐑' },
            { name: 'Paloma', file: basePath + 'Paloma.mp3', icon: '🕊️' }
        ];

        const audioInstances = {};

        function createSoundBoard() {
            const grid = document.getElementById('soundGrid');

            soundList.forEach((item, index) => {
                const audio = new Audio(item.file);
                audioInstances[index] = audio;

                const card = document.createElement('div');
                card.className = 'sound-card';

                card.innerHTML = `
                    <div class="status-badge"></div>
                    <div class="icon-wrapper">${item.icon}</div>
                    <div class="sound-title">${item.name}</div>
                    <label class="loop-control" onclick="event.stopPropagation()">
                        <input type="checkbox" id="loop-${index}">
                        <span>Loop</span>
                    </label>
                `;

                // Control al hacer clic en la tarjeta
                card.addEventListener('click', () => {
                    const checkbox = document.getElementById(`loop-${index}`);
                    audio.loop = checkbox.checked;

                    if (audio.paused) {
                        audio.currentTime = 0;
                        audio.play().catch(e => {
                            console.error('Error al reproducir audio:', e);
                            alert('No se pudo cargar el audio. Verifica la ruta: ' + item.file);
                        });
                        card.classList.add('playing');
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                        card.classList.remove('playing');
                    }
                });

                // Al finalizar la reproducción
                audio.addEventListener('ended', () => {
                    card.classList.remove('playing');
                });

                // Cambio de la opción Loop en ejecución
                const checkbox = card.querySelector(`#loop-${index}`);
                checkbox.addEventListener('change', (e) => {
                    audio.loop = e.target.checked;
                });

                grid.appendChild(card);
            });
        }

        function stopAllAudio() {
            Object.values(audioInstances).forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            document.querySelectorAll('.sound-card').forEach(card => {
                card.classList.remove('playing');
            });
        }

        document.addEventListener('DOMContentLoaded', createSoundBoard);
    </script>
</body>
</html>
