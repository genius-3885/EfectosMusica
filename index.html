<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Efectos de Sonido</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-active: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --active-glow: rgba(56, 189, 248, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 1100px;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-sub);
            font-size: 1rem;
        }

        .controls-bar {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1100px;
            justify-content: center;
        }

        .stop-all-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .stop-all-btn:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
        }

        .sound-card {
            background-color: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        .sound-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-active);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .sound-card.playing {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--active-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--active-glow); }
            50% { box-shadow: 0 0 22px var(--active-glow); }
            100% { box-shadow: 0 0 10px var(--active-glow); }
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 2.2rem;
            transition: transform 0.2s ease;
        }

        .sound-card:hover .icon-wrapper {
            transform: scale(1.1);
        }

        .sound-title {
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            word-break: break-word;
        }

        .card-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            align-items: center;
        }

        .loop-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        .loop-control input[type="checkbox"] {
            accent-color: var(--accent-color);
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            width: 100%;
            padding: 0 0.25rem;
        }

        .volume-icon {
            font-size: 0.75rem;
            color: var(--text-sub);
            user-select: none;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #475569;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .sound-card.playing .status-badge {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        /* --- MEDIA QUERIES (RESPONSIVO) --- */

        /* Tablets */
        @media (max-width: 768px) {
            body {
                padding: 1.5rem 0.75rem;
            }

            header h1 {
                font-size: 1.8rem;
            }

            header p {
                font-size: 0.9rem;
            }

            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .sound-card {
                padding: 1rem 0.75rem;
            }

            .icon-wrapper {
                width: 58px;
                height: 58px;
                font-size: 1.8rem;
                margin-bottom: 0.5rem;
            }

            .sound-title {
                font-size: 0.9rem;
                margin-bottom: 0.5rem;
            }
        }

        /* Teléfonos Móviles */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.5rem;
            }

            header {
                margin-bottom: 1rem;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .controls-bar {
                padding: 0.75rem 1rem;
                margin-bottom: 1.25rem;
            }

            .stop-all-btn {
                width: 100%;
                justify-content: center;
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }

            .sound-card {
                padding: 0.85rem 0.5rem;
                border-radius: 12px;
            }

            .icon-wrapper {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }

            .sound-title {
                font-size: 0.85rem;
            }

            .loop-control {
                font-size: 0.75rem;
                padding: 0.2rem 0.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Efectos de Sonido</h1>
        <p>Haz clic en cualquier tarjeta para reproducir o detener el audio</p>
    </header>

    <div class="controls-bar">
        <button class="stop-all-btn" onclick="stopAllAudio()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
            Detener Todos los Sonidos
        </button>
    </div>

    <div class="grid-container" id="soundGrid"></div>

    <script>
        const basePath = 'https://raw.githubusercontent.com/genius-3885/EfectosMusica/main/';

        const soundList = [
            { name: 'Aleteo', file: basePath + 'Aleteo.mp3', icon: '🕊️' },
            { name: 'Cierre Puerta', file: basePath + 'CierrePuerta.mp3', icon: '🚪' },
            { name: 'Cuervo', file: basePath + 'Cuervo.mp3', icon: '🐦‍⬛' },
            { name: 'Elefante', file: basePath + 'Elefante.mp3', icon: '🐘' },
            { name: 'Gente Murmullo', file: basePath + 'Gente-murmullo.mp3', icon: '👥' },
            { name: 'León', file: basePath + 'Leoin.mp3', icon: '🦁' },
            { name: 'Lluvia', file: basePath + 'Lluvia.mp3', icon: '🌧️' },
            { name: 'Martillo Madera', file: basePath + 'Marill-Madera.mp3', icon: '🔨' },
            { name: 'Serrucho Madera', file: basePath + 'Serrrucho-Madera.mp3', icon: '🪚' },
            { name: 'Mono', file: basePath + 'Mono.mp3', icon: '🐒' },
            { name: 'Océano', file: basePath + 'Oceano.mp3', icon: '🌊' },
            { name: 'Oveja', file: basePath + 'Oveja.mp3', icon: '🐑' },
            { name: 'Paloma', file: basePath + 'Paloma.mp3', icon: '🕊️' },
           { name: 'Risas', file: basePath + 'Risas.mp3', icon: '🤣' },           
            // Nuevos audios agregados:
    { name: 'Voz Dios 1', file: basePath + 'VozDios-1.mp3', icon: '🗣️' },
    { name: 'Voz Dios 2', file: basePath + 'VozDios-2.mp3', icon: '🗣️' },
    { name: 'Voz Dios 3', file: basePath + 'VozDios-3.mp3', icon: '🗣️' },
    { name: 'Voz Dios 4', file: basePath + 'VozDios-4.mp3', icon: '🗣️' }
        ];

        const audioInstances = {};

        function createSoundBoard() {
            const grid = document.getElementById('soundGrid');

            soundList.forEach((item, index) => {
                const audio = new Audio(item.file);
                audio.volume = 1.0; // Volumen inicial (100%)
                audioInstances[index] = audio;

                const card = document.createElement('div');
                card.className = 'sound-card';

                card.innerHTML = `
                    <div class="status-badge"></div>
                    <div class="icon-wrapper">${item.icon}</div>
                    <div class="sound-title">${item.name}</div>
                    <div class="card-controls">
                        <label class="loop-control" onclick="event.stopPropagation()">
                            <input type="checkbox" id="loop-${index}">
                            <span>Loop</span>
                        </label>
                        <div class="volume-control" onclick="event.stopPropagation()">
                            <span class="volume-icon">🔈</span>
                            <input type="range" class="volume-slider" id="volume-${index}" min="0" max="1" step="0.05" value="1">
                            <span class="volume-icon">🔊</span>
                        </div>
                    </div>
                `;

                // Clic en la tarjeta (reproducir / pausar)
                card.addEventListener('click', () => {
                    const checkbox = document.getElementById(`loop-${index}`);
                    audio.loop = checkbox.checked;

                    if (audio.paused) {
                        audio.currentTime = 0;
                        audio.play().catch(e => console.error('Error al reproducir:', e));
                        card.classList.add('playing');
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                        card.classList.remove('playing');
                    }
                });

                // Al finalizar la reproducción
                audio.addEventListener('ended', () => {
                    card.classList.remove('playing');
                });

                // Cambio del Checkbox de Loop
                const checkbox = card.querySelector(`#loop-${index}`);
                checkbox.addEventListener('change', (e) => {
                    audio.loop = e.target.checked;
                });

                // Control individual de volumen
                const volumeSlider = card.querySelector(`#volume-${index}`);
                volumeSlider.addEventListener('input', (e) => {
                    audio.volume = parseFloat(e.target.value);
                });

                grid.appendChild(card);
            });
        }

        function stopAllAudio() {
            Object.values(audioInstances).forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            document.querySelectorAll('.sound-card').forEach(card => {
                card.classList.remove('playing');
            });
        }

        document.addEventListener('DOMContentLoaded', createSoundBoard);
    </script>
</body>
</html>
